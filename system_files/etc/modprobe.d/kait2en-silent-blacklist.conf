# bluefin-t2 — silence the modules the kargs blacklist.
#
# Inherited from KAIT2EN's scripts/fedora/install-kernel-args.sh: the `module_blacklist=`
# karg stops the modules binding, but every attempt to load one still prints
# "Module X is blacklisted" at KERN_ERR. On the Bluefin initramfs udev asks for several of
# them, so a boot printed ~40 such lines (2026-10-22); the KaiT2EN host prints none because
# it ships this file. `install <module> /bin/true` makes modprobe answer the request without
# entering the kernel, so the blacklist stays in force and the log becomes quiet.
#
# The list must stay identical to module_blacklist= in
# /usr/lib/bootc/kargs.d/00-t2.toml; gate 11 compares them.
install acpi_tad /bin/true
install applesmc /bin/true
install macsmc /bin/true
install hid_apple /bin/true
install hid_appletb_bl /bin/true
install hid_appletb_kbd /bin/true
install hid_magicmouse /bin/true
install appletbdrm /bin/true
install apple_bce /bin/true
install apple_mfi_fastcharge /bin/true
install apple_gmux /bin/true
install sbs /bin/true
