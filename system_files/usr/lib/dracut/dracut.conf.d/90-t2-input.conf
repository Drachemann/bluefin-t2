# bluefin-t2 — the keyboard before root.
#
# Copied in spirit from the live host's /etc/dracut.conf.d/90-kait2en-input.conf
# (KAIT2EN scripts/fedora/rebuild-initramfs.sh:17-23, verified against the target).
#
# These six objects are what give the internal keyboard, trackpad and SMC at the LUKS
# prompt. dracut WARNS and continues when a forced driver is missing, so a typo, a
# renamed module or a stale path produces a green build and a machine with no keyboard.
# The proof is the `lsinitrd` assertion in build_files/90-tests.sh, not this line.
force_drivers+=" t2bce_dma t2bce_core t2bce_vhci t2hid t2smc t2sbs "
