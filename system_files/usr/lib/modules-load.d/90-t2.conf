# bluefin-t2 — post-root module loads.
#
# Only the two modules nothing else depends on are listed here. The rest are matched by
# udev through their own ACPI/PCI/HID aliases, which is the ordering the driver model
# expects: forcing t2bce_vhci or t2hid from here would load them before the BCE DMA
# engine is ready and is exactly the kind of ordering hack the module metadata already
# encodes (see `depends:` in modinfo).
#
# t2smc provides the RTC (rtc0) and the battery charge limit, so it is loaded
# unconditionally: a machine whose SMC driver appears late sets its clock late.
t2smc
t2sbs

# These two are NOT auto-loadable and were missing after the first Tier 2 run
# (2026-10-21): t2bce_ave exports no modalias at all, and KAIT2EN loads it from its
# userspace (`kait2en-t2-remote.service`, ExecStartPre=modprobe t2bce_ave), which this
# slice does not ship. t2bdrm's USB modalias matches a touch-bar device that only appears
# once the BCE stack is up, so udev never requested it. Loading them here is what makes
# the Tier 2 module assertion test the image rather than the absence of the userspace
# layer. t2gmux stays OUT deliberately: it is expected_absent on the whole 13-inch class.
t2bce_ave
t2bdrm
