# The inherited kait2en-touchbar unit is WantedBy=graphical-session.target, and the GDM
# greeter session reaches that target too. In the greeter there is no seat ACL on the Touch
# Bar DRM node, so the daemon exits "open Touch Bar DRM device /dev/dri/card0: Permission
# denied" and systemd restarts it until the session ends — nine restarts on the scored boot
# of 2026-10-22. The real user's session has the seat ACL and the bar works.
#
# Skip the greeter session only. A path condition (ConditionPathIsReadWrite=/dev/dri/card0)
# would also skip when the DRM node appears late, and conditions are evaluated once, so the
# bar would then never start. The user name is the stable, Fedora-defined discriminator.
[Unit]
ConditionUser=!gdm-greeter
